<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're offline — NexRun</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0a0a;
      color: #f5f5f5;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 800; color: #f97316; margin-bottom: 0.75rem; }
    p { font-size: 0.9rem; color: #a3a3a3; max-width: 360px; line-height: 1.6; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: #f97316;
      color: #fff;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.65rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      transition: background 0.15s;
    }
    a:hover { background: #ea6c10; }
    .brand { margin-top: 3rem; font-size: 0.75rem; color: #525252; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div class="icon">🏃</div>
  <h1>You're offline</h1>
  <p>It looks like you've lost your internet connection. Check your network and try again — your race registrations will be waiting.</p>
  <a href="/" onclick="location.reload(); return false;">Try again</a>
  <p class="brand">NexRun &mdash; Malaysia&rsquo;s Premier Run Event Platform</p>
</body>
</html>
